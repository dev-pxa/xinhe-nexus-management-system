name: Deploy Xinhe Nexus Management UI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-xinhe-nexus-management-ui
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.NEXUS_SSH_HOST }}
      SSH_USER: ${{ secrets.NEXUS_SSH_USER }}
      SSH_PORT: ${{ secrets.NEXUS_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.NEXUS_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ vars.NEXUS_FRONTEND_DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate deployment script
        run: bash -n scripts/deploy-ssh.sh

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing secret: NEXUS_SSH_HOST}"
          : "${SSH_USER:?Missing secret: NEXUS_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing secret: NEXUS_SSH_PRIVATE_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/xinhe_management_deploy_key
          chmod 600 ~/.ssh/xinhe_management_deploy_key
          known_host_tmp="$(mktemp)"
          for attempt in $(seq 1 6); do
            if ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" > "$known_host_tmp" 2>/dev/null \
              && [[ -s "$known_host_tmp" ]]; then
              cat "$known_host_tmp" >> ~/.ssh/known_hosts
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "::error::Unable to obtain SSH host key from $SSH_HOST after 6 attempts"
              exit 1
            fi
            echo "SSH host-key scan ${attempt}/6 failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          export SSH_PORT="${SSH_PORT:-22}"
          export DEPLOY_PATH="${DEPLOY_PATH:-/opt/xinhe-nexus-management-system}"
          export SSH_KEY_PATH="$HOME/.ssh/xinhe_management_deploy_key"
          export WEB_DOCKERFILE=Dockerfile.release
          chmod +x scripts/deploy-ssh.sh
          scripts/deploy-ssh.sh
