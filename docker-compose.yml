services:
  xinhe-nexus-web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    image: xinhe-nexus-web:latest
    container_name: xinhe-nexus-web
    ports:
      - "${WEB_PORT:-18080}:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-nexus.glowlink.ren}
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:18081}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://host.docker.internal:18083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

